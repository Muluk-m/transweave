name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check server
        run: pnpm --filter @transweave/server exec tsc --noEmit

      - name: Type-check web
        run: pnpm --filter @transweave/web exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transweave
          POSTGRES_PASSWORD: transweave
          POSTGRES_DB: transweave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U transweave"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter @transweave/server test
        env:
          JWT_SECRET: test-jwt-secret-12345
          NODE_OPTIONS: '--experimental-vm-modules'

      - name: Run e2e tests
        run: pnpm --filter @transweave/server test:e2e
        env:
          JWT_SECRET: e2e-test-jwt-secret-12345
          DATABASE_URL: postgresql://transweave:transweave@localhost:5432/transweave_test
          NODE_OPTIONS: '--experimental-vm-modules'

  build:
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter @transweave/server build

      - name: Build web
        run: pnpm --filter @transweave/web build

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f packages/server/Dockerfile .

      - name: Build web image
        run: docker build -f packages/web/Dockerfile .
